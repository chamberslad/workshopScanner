services:
  scanner:
    build: .
    restart: unless-stopped
    depends_on:
      - server

  server:
    build: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://scanner:${DB_PASSWORD}@postgres:5432/scanner
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: scanner
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: scanner
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanner"]
      interval: 5s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - scanner

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
